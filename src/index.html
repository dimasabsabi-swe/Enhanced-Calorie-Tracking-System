<!DOCTYPE html>
<!--
  Enhanced Calorie Tracking System (ECTS)
  SWE 401 — Phase 5 Implementation Prototype

  Single-page application. All screens live in this file as <section>
  elements; app.js renders their dynamic content and switches between
  them using hash-based routing (#/login, #/dashboard, #/search,
  #/food/<id>, #/history, #/profile).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12392C">
  <meta name="description" content="Enhanced Calorie Tracking System — log meals, search foods and track daily calorie goals.">
  <title>Enhanced Calorie Tracking System</title>

  <!-- Typography: Josefin Sans (Light 300, Regular 400, Medium 500, Bold 700).
       If offline, the CSS falls back to the system sans-serif stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ============================================================
         SCREEN 1 — LOGIN
         ============================================================ -->
    <section class="screen screen--login" id="screen-login" data-screen="login" hidden>
      <div class="login">
        <div class="login__brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="56" height="56">
              <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="94 126" stroke-linecap="round" transform="rotate(-90 24 24)"/>
              <path d="M24 14c-4 5-6 8-6 11a6 6 0 0 0 12 0c0-3-2-6-6-11z" fill="currentColor"/>
            </svg>
          </div>
          <h1 class="login__title">Enhanced Calorie<br>Tracking System</h1>
          <p class="login__subtitle">Track meals. Hit your goals.</p>
        </div>

        <form class="card login__card" id="login-form" novalidate>
          <h2 class="section-title">Welcome back</h2>

          <div class="field">
            <label class="field__label" for="login-email">Email</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label class="field__label" for="login-password">Password</label>
            <div class="input-wrap">
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
              <button type="button" class="input-wrap__toggle" data-action="toggle-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <p class="form-error" id="login-error" role="alert" hidden></p>

          <button type="submit" class="btn btn--primary btn--block" id="login-submit">Login</button>

          <div class="login__links">
            <button type="button" class="link" data-action="open-forgot">Forgot password?</button>
            <button type="button" class="link" data-action="fill-demo">Use demo account</button>
          </div>
        </form>

        <p class="login__hint">Demo: <strong>demo@ects.app</strong> / <strong>demo123</strong></p>
      </div>
    </section>

    <!-- Main application shell (visible only when logged in) -->
    <main class="app-main" id="app-main" hidden>

      <!-- ============================================================
           SCREEN 2 — DASHBOARD
           ============================================================ -->
      <section class="screen" id="screen-dashboard" data-screen="dashboard" hidden aria-labelledby="dashboard-title"></section>

      <!-- ============================================================
           SCREEN 3 — SEARCH FOOD
           ============================================================ -->
      <section class="screen" id="screen-search" data-screen="search" hidden aria-labelledby="search-title">
        <header class="page-header">
          <h1 class="page-title" id="search-title">Search Food</h1>
          <p class="page-subtitle">Find a food and add it to your meals</p>
        </header>

        <form class="search-bar" id="search-form" role="search">
          <label for="search-input" class="visually-hidden">Search foods</label>
          <span class="search-bar__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <input class="search-bar__input" id="search-input" type="search" placeholder="e.g. chicken, rice, apple" autocomplete="off">
          <button class="btn btn--primary search-bar__btn" type="submit" id="search-submit">Search</button>
        </form>

        <div class="chips" id="search-categories" role="tablist" aria-label="Food categories"></div>
        <p class="results-meta" id="search-meta" aria-live="polite"></p>
        <ul class="food-list" id="search-results"></ul>
      </section>

      <!-- ============================================================
           SCREEN 4 — FOOD DETAILS
           ============================================================ -->
      <section class="screen" id="screen-food" data-screen="food" hidden></section>

      <!-- ============================================================
           SCREEN 5 — NUTRITION HISTORY
           ============================================================ -->
      <section class="screen" id="screen-history" data-screen="history" hidden aria-labelledby="history-title"></section>

      <!-- ============================================================
           SCREEN 6 — USER PROFILE
           ============================================================ -->
      <section class="screen" id="screen-profile" data-screen="profile" hidden aria-labelledby="profile-title"></section>
    </main>

    <!-- ============================================================
         BOTTOM NAVIGATION (consistent across all logged-in screens)
         ============================================================ -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation" hidden>
      <a href="#/dashboard" class="bottom-nav__item" data-nav="dashboard" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      <a href="#/search" class="bottom-nav__item" data-nav="search" aria-label="Search food">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span>
      </a>
      <a href="#/search" class="bottom-nav__item bottom-nav__item--add" data-nav="add" aria-label="Add meal">
        <span class="bottom-nav__add">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
      </a>
      <a href="#/history" class="bottom-nav__item" data-nav="history" aria-label="Nutrition history">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>History</span>
      </a>
      <a href="#/profile" class="bottom-nav__item" data-nav="profile" aria-label="Profile">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Profile</span>
      </a>
    </nav>

    <!-- Forgot-password modal (simulated reset flow) -->
    <div class="modal" id="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title" hidden>
      <div class="modal__backdrop" data-action="close-forgot"></div>
      <form class="modal__panel card" id="forgot-form" novalidate>
        <h2 class="section-title" id="forgot-title">Reset password</h2>
        <p class="muted">Enter your account email and we'll send you a reset link.</p>
        <div class="field">
          <label class="field__label" for="forgot-email">Email</label>
          <input class="input" id="forgot-email" type="email" placeholder="you@example.com" required>
        </div>
        <p class="form-error" id="forgot-error" role="alert" hidden></p>
        <p class="form-success" id="forgot-success" role="status" hidden></p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" data-action="close-forgot">Cancel</button>
          <button type="submit" class="btn btn--primary">Send link</button>
        </div>
      </form>
    </div>

    <!-- Toast notifications -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
